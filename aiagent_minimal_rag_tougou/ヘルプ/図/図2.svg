<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg"
         font-size="12" text-anchor="middle" width="760" height="330"><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0L10 5L0 10z" fill="#7d7a73"/>
        </marker>
      </defs>
      
      <rect x="16" y="120" width="104" height="70" rx="8" fill="none" stroke="#d9d6cf"/>
      <text x="68" y="150" fill="#1f1e1d" font-weight="bold">画面</text>
      <text x="68" y="168" fill="#7d7a73" font-size="11">質問を送る／答えが並ぶ</text>
      
      <rect x="168" y="110" width="160" height="90" rx="8" fill="none" stroke="#d9d6cf"/>
      <text x="248" y="138" fill="#1f1e1d" font-weight="bold">アプリ：準備</text>
      <text x="248" y="156" fill="#7d7a73" font-size="11">道具の説明書＋カタログ＋</text>
      <text x="248" y="172" fill="#7d7a73" font-size="11">これまでの会話＋質問</text>
      
      <rect x="376" y="110" width="130" height="90" rx="8" fill="none" stroke="#b8552f" stroke-width="2"/>
      <text x="441" y="138" fill="#1f1e1d" font-weight="bold">AI</text>
      <text x="441" y="156" fill="#7d7a73" font-size="11">道具を頼む</text>
      <text x="441" y="172" fill="#7d7a73" font-size="11">または文章で答える</text>
      
      <rect x="554" y="110" width="190" height="90" rx="8" fill="none" stroke="#d9d6cf"/>
      <text x="649" y="138" fill="#1f1e1d" font-weight="bold">アプリ：検査・実行</text>
      <text x="649" y="156" fill="#7d7a73" font-size="11">SELECT だけか検査して実行</text>
      <text x="649" y="172" fill="#7d7a73" font-size="11">結果を画面用とAI用に分ける</text>
      
      <rect x="574" y="250" width="150" height="56" rx="8" fill="none" stroke="#d9d6cf"/>
      <text x="649" y="273" fill="#1f1e1d">データベース・文書</text>
      <text x="649" y="291" fill="#7d7a73" font-size="11">読み取り専用で開く</text>
      
      <line x1="120" y1="145" x2="160" y2="145" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="140" y="136" fill="#b8552f" font-size="11" font-weight="bold">1</text>
      <line x1="328" y1="145" x2="368" y2="145" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="348" y="136" fill="#b8552f" font-size="11" font-weight="bold">2</text>
      <line x1="506" y1="145" x2="546" y2="145" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="526" y="136" fill="#b8552f" font-size="11" font-weight="bold">3</text>
      <line x1="649" y1="200" x2="649" y2="242" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="662" y="226" fill="#b8552f" font-size="11" font-weight="bold">4</text>
      <path d="M600 110 C 600 70, 480 70, 448 102" fill="none" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="530" y="74" fill="#b8552f" font-size="11" font-weight="bold">5</text>
      <text x="530" y="90" fill="#7d7a73" font-size="11">結果（件数・先頭数行・預かり番号）</text>
      <path d="M400 200 C 380 250, 120 250, 72 198" fill="none" stroke="#7d7a73" marker-end="url(#ar2)"/>
      <text x="236" y="248" fill="#b8552f" font-size="11" font-weight="bold">6</text>
      <text x="236" y="264" fill="#7d7a73" font-size="11">文章は少しずつ、表やグラフは出来た順に</text>
      <text x="441" y="226" fill="#7d7a73" font-size="11">3〜5 を、文章の答えが出るまで数回くり返す</text>
    </svg>
