- q: 発注が必要な部品は？
  description: 在庫が発注点を下回っているもの。納期と仕入先も添える
  sql: SELECT m.part_code AS 部品, m.part_name AS 品名, i.qty_on_hand AS 在庫, i.reorder_point
    AS 発注点, s.supplier_name AS 仕入先, s.lead_days AS 納期日数 FROM 部品_在庫__inventory i JOIN
    部品_在庫__parts_master m ON m.part_code = i.part_code LEFT JOIN 部品_在庫__suppliers
    s ON s.part_code = i.part_code WHERE i.qty_on_hand <= i.reorder_point
