glossary:
  突発停止:
    description: 計画外の停止。stop_records に入っているものすべて
    sql: ''
  計画停止:
    description: 定期点検など予定された停止。maintenance_records の work_type='点検'
    sql: ''
  MTBF:
    description: 平均故障間隔。対象期間の日数 ÷ 停止件数（日）。MTTRが「直すのにかかる時間」なのに対し、MTBFは「どれくらい持つか」
    sql: ''
  突発停止（設備・保全（関西工場））:
    description: 計画外の停止。stop_records に入っているものすべて
  計画停止（設備・保全（関西工場））:
    description: 定期点検など予定された停止。maintenance_records の work_type='点検'
  MTBF（設備・保全（関西工場））:
    description: 平均故障間隔。対象期間の日数 ÷ 停止件数（日）。MTTRが「直すのにかかる時間」なのに対し、MTBFは「どれくらい持つか」
  起票済みの停止:
    description: トラブル事例として文書が作られた停止。case_no でナレッジベースの事例と突き合わせられる
    sql: case_no IS NOT NULL
  長時間停止:
    description: 復旧に60分以上かかった停止。原因の切り分けか部品待ちが起きている
    sql: minutes >= 60
  突発停止（設備・保全（九州工場））:
    description: 計画外の停止。stop_records に入っているものすべて
  計画停止（設備・保全（九州工場））:
    description: 定期点検など予定された停止。maintenance_records の work_type='点検'
  MTBF（設備・保全（九州工場））:
    description: 平均故障間隔。対象期間の日数 ÷ 停止件数（日）。MTTRが「直すのにかかる時間」なのに対し、MTBFは「どれくらい持つか」
  所定労働時間:
    description: 1日8時間（480分）・1週40時間（就業規則第15条）
  在宅率:
    description: 在宅で勤務した日数 ÷ 出勤日数
  目標復旧時間:
    description: P1=2時間 / P2=4時間 / P3=8時間 / P4=24時間
  変更起因の障害:
    description: 原因が「変更作業の影響」のインシデント
    sql: root_cause = '変更作業の影響'
  要発注:
    description: 在庫が発注点を下回っている状態。発注点は共用する設備の台数とリードタイムを考えて決める（STD-106）
    sql: qty_on_hand <= reorder_point
  欠品:
    description: 在庫がゼロの部品。故障したらリードタイムぶんそのまま止まる
    sql: qty_on_hand = 0
  長納期部品:
    description: リードタイムが15日以上の部品。在庫ゼロを許容してはいけない（STD-106）
    sql: lead_days >= 15
  共用部品:
    description: 複数の設備で使う部品。SN-14 はA装置とD装置で共用しており、1台分の在庫では足りない（改善事例095）
  所定時間:
    description: 1シフトあたり480分。稼働率の分母（STD-104）
  計画停止（生産実績）:
    description: 段取り替え・定期点検。stop_minutes には入らない。突発停止と混ぜるとMTTRも稼働率も意味が変わる
  計画停止（生産実績（関西工場））:
    description: 段取り替え・定期点検。stop_minutes には入らない。突発停止と混ぜるとMTTRも稼働率も意味が変わる
  計画停止（生産実績（九州工場））:
    description: 段取り替え・定期点検。stop_minutes には入らない。突発停止と混ぜるとMTTRも稼働率も意味が変わる
  不良率:
    description: 不良数 ÷ 生産実績数。生産数は 生産実績__production_daily から取る
  直行率:
    description: 手直しせずに良品になった割合。手直しで良品化したものは不良に数える（STD-105）
  流出不良:
    description: 客先で見つかった不良。claims の数量。社内不良(defects)とは別に数える
  設備起因の不良:
    description: 特定の設備で作られた不良。equip_code で絞る。D01（寸法不良）はセンサーの校正ずれと関係が深い
  勝率:
    description: 受注件数 ÷（受注件数＋失注件数）。進行中は分母に入れない
  主要顧客:
    description: 取引ランクがAの顧客
    sql: rank = 'A'
  与信超過:
    description: 受注残が与信枠を超えている状態。経理部の承認が要る
  全社:
    description: 「会社全体」「合計」も同じ。拠点・区分で分かれた同じ領域の表すべてを UNION ALL で合算した全体の範囲。どれか1つの表だけで答えない。
    sql: ''
examples:
- q: シフト別のMTTRを比べて
  description: 夜勤(B)は保全が1名で、復旧が長引く傾向がある（改善事例104）
  sql: SELECT s.shift_code AS シフト, COUNT(*) AS 件数, ROUND(AVG(s.minutes),1) AS MTTR分
    FROM 設備_保全_九州工場__stop_records s GROUP BY s.shift_code ORDER BY シフト
- q: 原因区分ごとの停止時間の内訳は？
  sql: SELECT s.cause_type AS 原因, COUNT(*) AS 件数, SUM(s.minutes) AS 合計分, ROUND(AVG(s.minutes),1)
    AS 平均分 FROM 設備_保全_九州工場__stop_records s GROUP BY s.cause_type ORDER BY 合計分 DESC
- q: 時間外が月45時間を超えた社員は？
  description: 就業規則第17条の上限。2か月連続なら産業医面談の対象
  sql: SELECT e.emp_name AS 氏名, d.dept_name AS 部署, o.year_month AS 年月, o.overtime_hours
    AS 時間外 FROM 人事_勤怠__overtime_monthly o JOIN 人事_勤怠__employees e ON e.emp_no = o.emp_no
    JOIN 人事_勤怠__departments d ON d.dept_code = e.dept_code WHERE o.overtime_hours
    > 45 ORDER BY o.overtime_hours DESC
- q: 産業医面談が必要な社員を出して
  description: 45時間超が2か月以上
  sql: SELECT e.emp_name AS 氏名, COUNT(*) AS 超過月数, ROUND(MAX(o.overtime_hours),1) AS
    最大時間外 FROM 人事_勤怠__overtime_monthly o JOIN 人事_勤怠__employees e ON e.emp_no = o.emp_no
    WHERE o.overtime_hours > 45 GROUP BY e.emp_name HAVING COUNT(*) >= 2 ORDER BY
    超過月数 DESC
- q: 部署別の平均残業時間を月別に見せて
  sql: SELECT d.dept_name AS 部署, o.year_month AS 年月, ROUND(AVG(o.overtime_hours),1)
    AS 平均時間外 FROM 人事_勤怠__overtime_monthly o JOIN 人事_勤怠__employees e ON e.emp_no =
    o.emp_no JOIN 人事_勤怠__departments d ON d.dept_code = e.dept_code GROUP BY d.dept_name,
    o.year_month ORDER BY d.dept_name, o.year_month
- q: 必須研修を受けていない社員はいる？
  description: 記録が無い＝未受講。在籍者だけを対象にする
  sql: SELECT e.emp_name AS 氏名, d.dept_name AS 部署 FROM 人事_勤怠__employees e JOIN 人事_勤怠__departments
    d ON d.dept_code = e.dept_code WHERE e.status = '在籍' AND NOT EXISTS (SELECT 1
    FROM 人事_勤怠__trainings t WHERE t.emp_no = e.emp_no AND t.training_code = 'TR-03')
- q: 在宅勤務の利用状況は？
  sql: SELECT d.dept_name AS 部署, COUNT(*) AS 出勤日数, SUM(a.remote) AS 在宅日数, ROUND(100.0
    * SUM(a.remote) / COUNT(*), 1) AS 在宅率 FROM 人事_勤怠__attendance a JOIN 人事_勤怠__employees
    e ON e.emp_no = a.emp_no JOIN 人事_勤怠__departments d ON d.dept_code = e.dept_code
    WHERE a.att_type = '出勤' GROUP BY d.dept_name ORDER BY 在宅率 DESC
