    columns:
      dept_code:
        description: 部署コード
      dept_name:
        description: 部署名
  情報システム__incidents:
    description: インシデント（障害・問い合わせ）。1行 = 1件。
    columns:
      inc_id:
        description: インシデントID
      opened_at:
        description: 受付日時。目標復旧時間の起点
      closed_at:
        description: クローズ日時
      priority:
        description: 優先度
        values:
          P1: 重大。全社または基幹システムが停止（目標2時間）
          P2: 高。部門単位で業務に支障（目標4時間）
          P3: 中。一部機能が使えない（目標1営業日）
          P4: 低。軽微な不具合・問い合わせ（目標3営業日）
      category:
        description: 分類（アカウント・PC故障・ネットワーク等）
      reporter_emp_no:
        description: 報告者（hr.employees__emp_no）
      assignee:
        description: 担当者
      summary:
        description: 概要
      resolve_minutes:
        description: 復旧までの時間（分）
      sla_met:
        description: 目標復旧時間を満たしたか
        values:
          '1': 達成
          '0': 未達
      root_cause:
        description: 原因
        values:
          設定誤り: ''
          機器故障: ''
          利用者操作: ''
          外部要因: 回線・クラウド障害
          変更作業の影響: changes と突き合わせる
          不明: ''
      status:
        description: 状態
    glossary:
      SLA達成率:
        description: 目標復旧時間を満たした割合
        sql: 100.0 * SUM(sla_met) / COUNT(*)
      重大インシデント:
        description: P1またはP2。原因の特定と報告書が必須
        sql: priority IN ('P1','P2')
      平均復旧時間:
        description: 受付からクローズまでの平均（分）
        sql: AVG(resolve_minutes)
  情報システム__assets:
    description: IT資産。貸与PC・モニタ・貸出機材など。
    columns:
      asset_id:
        description: 資産ID
      asset_type:
        description: 種別（ノートPC・モニタ・プリンタ等）
      model:
        description: 型式
      purchased_on:
        description: 購入日
      warranty_until:
        description: 保証期限。過ぎると修理は部署負担
      assigned_emp_no:
        description: 貸与先（hr.employees__emp_no）。未割当はNULL
      location:
        description: 設置場所
      status:
        description: 状態
        values:
          稼働: ''
          修理中: ''
          廃棄予定: ''
    glossary:
      保証切れ:
        description: 保証期限を過ぎた資産。修理費は部署負担になる
        sql: warranty_until < date('now')
      遊休資産:
        description: 誰にも割り当てられていない資産
        sql: assigned_emp_no IS NULL
  情報システム__licenses:
    description: |-
      ソフトウェアライセンス。
      ※ 指名ユーザーは特定の人に紐づき共有できない。同時使用は同時に使える人数の上限。
    columns:
      lic_id:
        description: ライセンスID
      software:
        description: ソフト名
      license_type:
        description: 形態
        values:
          指名ユーザー: 特定の人に紐づく。共有不可
          同時使用: 同時に使える人数の上限
      seats:
        description: 保有数
      unit_cost:
        description: 年間単価（円）
      expires_on:
        description: 契約期限
  情報システム__license_assignments:
    description: |-
      ライセンスの割り当て。
      ※ 3か月以上使っていない割り当ては、棚卸（4月・10月）で回収する（ナレッジベース「ソフトウェアライセンス管理」）。
    columns:
      assign_id:
        description: 割当ID
      lic_id:
        description: ライセンス（licenses）
      emp_no:
        description: 利用者（hr.employees__emp_no）
      assigned_on:
        description: 割当日
      last_used_on:
        description: 最終利用日
    glossary:
      遊休ライセンス:
        description: 3か月以上使われていない割り当て。棚卸で回収する
        sql: last_used_on < date('now', '-3 months')
  情報システム__accounts:
    description: |-
      システムのアカウント。
      ※ 退職者のアカウントは退職日当日に停止する（情報セキュリティ規程）。在籍状況は人事の表と突き合わせて確認する。
    columns:
      account_id:
        description: アカウントID
      emp_no:
        description: 社員番号（hr.employees__emp_no）
      system_name:
        description: 対象システム
      created_on:
        description: 作成日
      disabled_on:
        description: 停止日。有効ならNULL
      mfa_enabled:
        description: 多要素認証
        values:
          '1': 有効
          '0': 無効（社外アクセスは不可）
      status:
        description: 状態
        values:
          有効: ''
          停止: ''
  情報システム__changes:
    description: |-
      変更作業の記録。
      ※ 変更は原則として業務時間外に行い、切り戻し手順を用意してから実施する。インシデントの多くは変更作業の直後に起きる。
    columns:
      change_id:
        description: 変更ID
      planned_on:
        description: 予定日
      executed_on:
        description: 実施日
      target:
        description: 対象システム
      description:
        description: 作業内容
      approver:
        description: 承認者
      rollback_ready:
        description: 切り戻し手順の用意
        values:
          '1': あり
          '0': なし（本来は必須）
      result:
        description: 結果
        values:
          成功: ''
          切り戻し: 失敗して戻した
  情報システム_工場側__incidents:
    description: インシデント（障害・問い合わせ）。1行 = 1件。
    columns:
      inc_id:
        description: インシデントID
      opened_at:
        description: 受付日時。目標復旧時間の起点
      closed_at:
        description: クローズ日時
      priority:
        description: 優先度
        values:
          P1: 重大。全社または基幹システムが停止（目標2時間）
          P2: 高。部門単位で業務に支障（目標4時間）
          P3: 中。一部機能が使えない（目標1営業日）
          P4: 低。軽微な不具合・問い合わせ（目標3営業日）
      category:
        description: 分類（アカウント・PC故障・ネットワーク等）
      reporter_emp_no:
        description: 報告者（hr.employees__emp_no）
      assignee:
        description: 担当者
      summary:
        description: 概要
      resolve_minutes:
        description: 復旧までの時間（分）
      sla_met:
        description: 目標復旧時間を満たしたか
        values:
          '1': 達成
          '0': 未達
      root_cause:
        description: 原因
        values:
          設定誤り: ''
          機器故障: ''
          利用者操作: ''
          外部要因: 回線・クラウド障害
          変更作業の影響: changes と突き合わせる
          不明: ''
      status:
        description: 状態
    glossary:
      SLA達成率:
        description: 目標復旧時間を満たした割合
        sql: 100.0 * SUM(sla_met) / COUNT(*)
      重大インシデント:
        description: P1またはP2。原因の特定と報告書が必須
        sql: priority IN ('P1','P2')
      平均復旧時間:
        description: 受付からクローズまでの平均（分）
        sql: AVG(resolve_minutes)
  情報システム_工場側__assets:
    description: IT資産。貸与PC・モニタ・貸出機材など。
    columns:
      asset_id:
        description: 資産ID
      asset_type:
        description: 種別（ノートPC・モニタ・プリンタ等）
      model:
        description: 型式
      purchased_on:
        description: 購入日
      warranty_until:
        description: 保証期限。過ぎると修理は部署負担
      assigned_emp_no:
        description: 貸与先（hr.employees__emp_no）。未割当はNULL
      location:
        description: 設置場所
      status:
        description: 状態
        values:
          稼働: ''
          修理中: ''
          廃棄予定: ''
    glossary:
      保証切れ:
        description: 保証期限を過ぎた資産。修理費は部署負担になる
        sql: warranty_until < date('now')
      遊休資産:
        description: 誰にも割り当てられていない資産
        sql: assigned_emp_no IS NULL
  情報システム_工場側__licenses:
    description: |-
      ソフトウェアライセンス。
      ※ 指名ユーザーは特定の人に紐づき共有できない。同時使用は同時に使える人数の上限。
