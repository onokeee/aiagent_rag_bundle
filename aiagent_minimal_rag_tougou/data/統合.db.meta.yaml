      emp_no:
        description: 利用者（hr.employees__emp_no）
      assigned_on:
        description: 割当日
      last_used_on:
        description: 最終利用日
    glossary:
      遊休ライセンス:
        description: 3か月以上使われていない割り当て。棚卸で回収する
        sql: last_used_on < date('now', '-3 months')
