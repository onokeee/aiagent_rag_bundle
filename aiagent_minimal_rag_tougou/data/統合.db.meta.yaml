  sql: SELECT strftime('%Y-%m', r.rework_date) AS 月, r.result AS 結果, COUNT(*) AS 件数,
    SUM(r.qty) AS 数量, SUM(r.minutes) AS 工数分 FROM 品質_九州工場__rework r GROUP BY 1, 2 ORDER
    BY 1, 2
- q: 検査でNGが出た日は？
  description: NGが出た日は設備側を確認する（校正・治具・工具の摩耗）
  sql: SELECT i.inspect_date AS 検査日, i.product_code AS 品目, i.lot_no AS ロット, i.measured
    AS 測定値 FROM 品質_九州工場__inspections i WHERE i.judge = 'NG' ORDER BY i.inspect_date
- q: 未対策のクレームはある？
  sql: SELECT c.claim_id AS クレームNo, c.claim_date AS 受付日, c.customer AS 客先, c.product_code
    AS 品目, c.qty AS 数量, c.status AS 状況 FROM 品質_九州工場__claims c WHERE c.status <> '対策済'
    ORDER BY c.claim_date
- q: 今の商談パイプラインを見せて
  description: 受注予測はS3以上のみ。S1・S2は件数だけ見る
  sql: SELECT d.phase AS フェーズ, COUNT(*) AS 件数, SUM(d.amount) AS 金額, SUM(d.amount *
    d.probability / 100.0) AS 予測額 FROM 営業_顧客__deals d WHERE d.result = '進行中' GROUP
    BY d.phase ORDER BY d.phase
- q: 上期の失注理由の内訳は？
  sql: SELECT d.lost_reason AS 理由, COUNT(*) AS 件数, SUM(d.amount) AS 金額 FROM 営業_顧客__deals
    d WHERE d.result = '失注' AND d.opened_on < '2026-10-01' GROUP BY d.lost_reason
    ORDER BY 金額 DESC
- q: 競合A社との勝率は？
  sql: SELECT d.result AS 結果, COUNT(*) AS 件数, SUM(d.amount) AS 金額 FROM 営業_顧客__deals
    d WHERE d.competitor = 'A社' AND d.result IN ('受注','失注') GROUP BY d.result
- q: 担当者別の受注実績を教えて
  sql: SELECT r.rep_name AS 担当, r.section AS 課, SUM(CASE WHEN d.result='受注' THEN 1
    ELSE 0 END) AS 受注件数, SUM(CASE WHEN d.result='受注' THEN d.amount ELSE 0 END) AS
    受注金額 FROM 営業_顧客__deals d JOIN 営業_顧客__sales_reps r ON r.rep_code = d.rep_code GROUP
    BY r.rep_name, r.section ORDER BY 受注金額 DESC
- q: 技術部に会えている商談と、購買部だけの商談で勝率は違う？
  description: 早期に技術部と会えた案件は勝率が高い（勝ちパターン）
  sql: SELECT CASE WHEN EXISTS (SELECT 1 FROM 営業_顧客__activities a WHERE a.deal_id
    = d.deal_id AND a.contact_dept = '技術部') THEN '技術部に接触あり' ELSE '購買部のみ' END AS 接触,
    COUNT(*) AS 件数, SUM(CASE WHEN d.result='受注' THEN 1 ELSE 0 END) AS 受注件数 FROM 営業_顧客__deals
    d WHERE d.result IN ('受注','失注') GROUP BY 接触
