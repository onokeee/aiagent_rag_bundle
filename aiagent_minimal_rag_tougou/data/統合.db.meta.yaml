- q: 設備別の稼働率を月別に出して
  description: 稼働率は稼働時間÷所定時間(480分×行数)。停止の多い月は下がる
  sql: SELECT p.equip_code AS 設備, strftime('%Y-%m', p.prod_date) AS 月, ROUND(100.0
    * SUM(p.run_minutes) / (COUNT(*) * 480), 1) AS 稼働率, SUM(p.stop_minutes) AS 停止分
    FROM 生産実績__production_daily p GROUP BY 1, 2 ORDER BY 1, 2
