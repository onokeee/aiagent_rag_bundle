        description: 発注日
      qty:
        description: 数量
      promised_on:
        description: 納期回答日
      arrived_on:
        description: 実際の入荷日。発注中はNULL
      status:
        description: 状態
        values:
          入荷済: 納入完了
          発注中: 未入荷
    glossary:
      納期遅延:
        description: 実際の入荷が納期回答より遅れたもの
        sql: arrived_on IS NOT NULL AND arrived_on > promised_on
      入荷待ち:
        description: 発注したがまだ届いていないもの
        sql: status = '発注中'
  生産実績__production_daily:
    description: 日次の生産実績。1行 = 日 × 設備 × シフト。
    columns:
      prod_date:
        description: 生産日（YYYY-MM-DD）
      line_code:
        description: ライン（line_master）
      equip_code:
        description: 設備（equipment__equipment）
      product_code:
        description: 品目（product_master）
      shift_code:
        description: シフト（shift_master）
      plan_qty:
        description: 計画数
      actual_qty:
        description: 実績数
      run_minutes:
        description: 稼働時間（分）
      stop_minutes:
        description: 停止時間（分）。equipment__stop_records と一致する
    glossary:
      達成率:
        description: 計画達成率。実績数÷計画数。設備が止まっても計画数は変えない（STD-104）
        sql: CAST(SUM(actual_qty) AS REAL) / SUM(plan_qty)
      稼働率:
        description: 稼働時間÷所定時間。所定時間は1シフト480分（STD-104）
        sql: CAST(SUM(run_minutes) AS REAL) / (COUNT(*) * 480)
      停止率:
        description: 停止時間が所定時間に占める割合
        sql: CAST(SUM(stop_minutes) AS REAL) / (COUNT(*) * 480)
