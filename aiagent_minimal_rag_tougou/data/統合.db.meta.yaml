- q: 8月のライン別の達成率は？
  sql: SELECT l.line_name AS ライン, SUM(p.plan_qty) AS 計画, SUM(p.actual_qty) AS 実績,
    ROUND(100.0 * SUM(p.actual_qty) / SUM(p.plan_qty), 1) AS 達成率 FROM 生産実績__production_daily
    p JOIN 生産実績__line_master l ON l.line_code = p.line_code WHERE p.prod_date LIKE
