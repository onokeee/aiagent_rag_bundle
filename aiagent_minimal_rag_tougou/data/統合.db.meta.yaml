tables:
  設備_保全_九州工場__stop_records:
    description: 設備の停止記録。1行 = 1回の突発停止。計画停止は含まない。
    columns:
      stop_id:
        description: 停止ID
      equip_code:
        description: 設備コード（equipment__equip_code）
      stop_date:
        description: 発生日（YYYY-MM-DD の文字列）
      start_time:
        description: 停止した時刻（HH:MM）
      end_time:
        description: 自動運転に復帰した時刻（HH:MM）
      minutes:
        description: 停止時間（分）。保全の待ち時間を含む
      alarm_code:
        description: アラームコード（alarm_master__alarm_code）
      cause_type:
        description: 原因区分
        values:
          部品劣化: 消耗品の劣化・寿命
          汚れ: 清掃で復旧したもの
          干渉: ワーク・治具の干渉
          詰まり: 搬送の詰まり
          設定値: 設定値の誤り・戻し忘れ
          摩耗: 部品の摩耗（ガイドローラ等）。詰まりと同じアラームでも復旧が長引く
          緩み: 締結・継手の緩み
          電池切れ: エンコーダ用電池の寿命。原点位置が消えて原点出しが要る
      case_no:
        description: トラブル事例の番号（起票された停止のみ）。この番号でナレッジベースの事例文書と突き合わせられる
      shift_code:
        description: 発生シフト（生産実績__shift_master と同じ区分）
    glossary:
      MTTR:
        description: 平均復旧時間。停止時間の合計 ÷ 停止件数（分）。保全の待ち時間を含む（STD-102）
        sql: CAST(SUM(minutes) AS REAL) / COUNT(*)
  設備_保全_九州工場__maintenance_records:
    description: 保全作業の記録。突発対応（交換）と計画点検の両方が入る。
    columns:
      work_id:
        description: 作業ID
      equip_code:
        description: 対象設備
      worked_on:
        description: 作業日
      work_type:
        description: 作業種別
        values:
          交換: 部品交換（突発対応）
          点検: 定期点検（計画）
      part_code:
        description: 使った部品（部品_在庫__parts_master）。点検はNULL
      minutes:
        description: 作業時間（分）
      worker:
        description: 作業者
  設備_保全_九州工場__inspection_plan:
    description: |-
      点検・部品交換の計画。1行 = 設備×点検項目。
      ※ registered=0 は設備台帳システムへ未登録で、期限が来ても通知が出ない。未登録のまま期限を過ぎた部品が、突発停止の原因になっている（改善事例079の残課題）。
    columns:
      plan_id:
        description: 計画ID
      equip_code:
        description: 対象設備
      item:
        description: 点検・交換の項目
      cycle_days:
        description: 周期（日）。0 は対象外
      last_done_on:
        description: 前回実施日
      next_due_on:
        description: 次回期限。今日を過ぎていれば期限超過
      registered:
        description: 設備台帳システムへの登録
        values:
          '1': 登録済み（期限の通知が出る）
          '0': 未登録（通知が出ない＝見落とす）
      owner:
        description: 担当
    glossary:
      期限超過:
        description: 次回期限を過ぎている点検・交換
        sql: next_due_on < date('now')
      台帳未登録:
        description: 設備台帳システムに登録されておらず、期限の通知が出ないもの
        sql: registered = 0
  人事_勤怠__employees:
    description: 社員マスタ。退職者も残る。
    columns:
      emp_no:
        description: 社員番号
      emp_name:
        description: 氏名。設備の表の maintenance_records__worker と同じ表記
      dept_code:
        description: 所属（departments）
      title:
        description: 役職
      hired_on:
        description: 入社日
      employment_type:
        description: 雇用区分
        values:
          正社員: ''
          契約社員: ''
          パート: ''
      shift_type:
        description: 勤務形態
        values:
          日勤: ''
          交替: 夜勤を含む交替勤務
      remote_allowed:
        description: 在宅勤務の可否
        values:
          '1': 可
          '0': 不可（製造ライン等）
      status:
        description: 在籍状況
        values:
          在籍: ''
          退職: ''
    glossary:
      現役社員:
        description: 在籍中の社員。人数を数えるときは必ずこれで絞る
        sql: status = '在籍'
  人事_勤怠__attendance:
    description: 日次の勤怠。1行 = 1人1日。稼働日のみ行がある。
    columns:
      att_id:
        description: 勤怠ID
      emp_no:
        description: 社員番号
      work_date:
        description: 日付
      att_type:
        description: 区分
        values:
          出勤: ''
          有給: 年次有給休暇
          欠勤: ''
      work_minutes:
        description: 所定内の勤務時間（分）。所定は480分
      overtime_minutes:
        description: 時間外（分）
      remote:
        description: 在宅勤務か
        values:
          '1': 在宅
          '0': 出社
    glossary:
      有給取得日数:
        description: 年5日の取得が法定義務（就業規則第22条）
        sql: COUNT(*) FILTER (WHERE att_type = '有給')
  人事_勤怠__overtime_monthly:
    description: |-
      月次の時間外集計。1行 = 1人1か月。
      ※ 上限は月45時間（就業規則第17条）。超過者は人事から通知、2か月連続で超えたら産業医面談の対象になる。
    columns:
      emp_no:
        description: 社員番号
      year_month:
        description: 年月（YYYY-MM）
      overtime_hours:
        description: 時間外（時間）
      night_hours:
        description: 深夜（22:00〜05:00）の時間
      holiday_hours:
        description: 休日労働の時間
    glossary:
      上限超過:
        description: 月45時間を超えた月（就業規則第17条）
        sql: overtime_hours > 45
      産業医面談の対象:
        description: 45時間超が2か月以上続いた社員
  人事_勤怠__certifications:
    description: 資格の保有。有効期限があるものと無いものがある。
    columns:
      cert_id:
        description: 登録ID
      emp_no:
        description: 社員番号
      cert_code:
        description: 資格コード
      cert_name:
        description: 資格名
      acquired_on:
        description: 取得日
      expires_on:
        description: 有効期限。期限の無い資格はNULL
    glossary:
      失効:
        description: 有効期限を過ぎた資格
        sql: expires_on IS NOT NULL AND expires_on < date('now')
  人事_勤怠__trainings:
    description: |-
      研修の受講記録。
      ※ 必須研修（新入社員・安全衛生・情報セキュリティ・ハラスメント防止）は全員が受講する必要がある。記録が無い＝未受講。
    columns:
      rec_id:
        description: 受講ID
      emp_no:
        description: 社員番号
      training_code:
        description: 研修コード
      training_name:
        description: 研修名
      taken_on:
        description: 受講日
      hours:
        description: 時間
      result:
        description: 結果
        values:
          修了: ''
          再受講: 未修了
  人事_勤怠__departments:
    description: 部署マスタ。
    columns:
