    i.qty_on_hand <= i.reorder_point AND i.part_code NOT IN (SELECT part_code FROM
    部品_在庫__purchase_orders WHERE status = '発注中')
- q: 納期に遅れた発注はある？
  sql: SELECT o.po_id AS 発注No, m.part_name AS 品名, o.promised_on AS 納期回答, o.arrived_on
