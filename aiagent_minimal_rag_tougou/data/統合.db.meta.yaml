      社内から使う外部サイトのリンク集。1行 = 1サイト。
      ※ 同じ内容が社内文書（ナレッジベース「社内Webリンク集」）にもある。URLの一覧・分類ごとの件数・管理部署で絞るならこの表、使い方や注意書きの文章を読むならナレッジベースを使う。
    columns:
      link_id:
        description: 通し番号（L-001 から）
      category:
        description: 分類
      site_name:
        description: サイト名
      url:
        description: URL
      purpose:
        description: 何に使うサイトか
      owner_dept:
        description: リンク切れのときの連絡先。人事_勤怠__departments.dept_name と同じ表記
      login_required:
        description: ログインが要るか。1=要る（社用アカウント）／0=不要
      checked_on:
        description: リンクが生きていることを最後に確認した日
      取得日時:
        description: この表に取り込んだ日時
  社内連絡先__users:
    description: |-
      社内の連絡先（メールアドレス）一覧。1行 = 1人。メールの宛先はここから探す。
      ※ 社員番号は名簿ごとの採番なので、E-1001 は拠点をまたぐと別人。人を一意に指すのは user_id、または site と emp_no の組み合わせ。
      ※ 元の名簿と結ぶときは site で相手を選ぶ。本社→人事_勤怠__employees、関西工場→人事_勤怠_関西工場__employees、本社（契約・パート）→人事_勤怠_契約社員__employees。
      ※ account_status が「停止」の人（退職者）には送らない。
    columns:
      user_id:
        description: 連絡先の通し番号。U-拠点記号-社員番号（HQ=本社／KS=関西工場／PT=契約・パート）
      emp_no:
        description: 社員番号。名簿ごとの採番なので、site とセットで使う
      user_name:
        description: 氏名
      name_kana:
        description: 氏名のカナ
      email:
        description: メールアドレス。宛先はこの列の値をそのまま使う（推測で作らない）
      dept_name:
        description: 部署名。人事_勤怠__departments.dept_name と同じ表記
      title:
        description: 役職
      site:
        description: 所属。本社／関西工場／本社（契約・パート）
      employment_type:
        description: 雇用区分
      account_status:
        description: 有効／停止。停止は退職者で、宛先に使ってはいけない
      updated_on:
        description: この連絡先を最後に確認した日
      取得日時:
        description: この表に取り込んだ日時
groups:
  社内連絡先:
    description: |-
      メールの宛先に使う連絡先。人事の名簿（人事_勤怠__* / 人事_勤怠_関西工場__* / 人事_勤怠_契約社員__*）から作った、拠点をまたぐ1本の一覧。
      ※ 宛先はこの表の email をそのまま使う。名前から推測してアドレスを組み立てない。
      ※ account_status が「停止」の人（退職者）には送らない。
  設備_保全_九州工場:
    description: |-
      九州工場の設備と停止・保全の記録。
      ※ 【ここは 設備・保全（九州工場） 専用】。本社工場のぶんは別のまとまり（equipment）にある。
      ※ 拠点を指定しない質問では、ここではなく本社の表を使うこと。
      ※ 数値は本社とは異なる（拠点ごとの実績）。この拠点の質問に答えるときは他拠点の数値と混ぜないこと（「全社」の合計を求められたときは合算してよい）。
      製造ラインの設備と、停止・保全の記録。
      ※ 停止時間（minutes）は「自動運転が止まってから復帰するまで」で、保全の待ち時間も含む（作業標準STD-102の定義）。
      ※ MTTR = 停止時間の合計 ÷ 停止件数。計画停止（点検）は stop_records に入っておらず、maintenance_records の work_type='点検' が計画側。
      ※ 2026年8月にA装置のMTTRが悪化した。原因や対策の文書はナレッジベース（トラブル事例・改善事例）にある。
  人事_勤怠:
    description: |-
      社員・勤怠・時間外・資格・研修。個人に紐づくため取り扱いに注意する。
      ※ 時間外の上限は月45時間・年360時間（就業規則第17条）。45時間を超えた社員には人事から通知、2か月連続で超えたら産業医面談の対象。
      ※ 在宅勤務は週2日まで。製造ラインに従事する者は対象外（remote_allowed=0。在宅勤務規程）。
      ※ 保全担当者の氏名は設備表（equipment.maintenance_records__worker）と同じ表記。
      ※ 退職者も employees に残る。現役だけを見るなら status='在籍' で絞る。
  人事_勤怠_契約社員:
    description: |-
      契約社員・パートの社員情報と勤怠。正社員とは別に管理している。
      ※ 【ここは 人事・勤怠（契約社員） 専用】。本社工場のぶんは別のまとまり（hr）にある。
      ※ 拠点を指定しない質問では、ここではなく本社の表を使うこと。
      ※ 数値は本社とは異なる（拠点ごとの実績）。この拠点の質問に答えるときは他拠点の数値と混ぜないこと（「全社」の合計を求められたときは合算してよい）。
      社員・勤怠・時間外・資格・研修。個人に紐づくため取り扱いに注意する。
