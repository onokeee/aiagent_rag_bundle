- q: 優先度別のSLA達成率を出して
  sql: SELECT i.priority AS 優先度, COUNT(*) AS 件数, SUM(i.sla_met) AS 達成件数, ROUND(100.0
    * SUM(i.sla_met) / COUNT(*), 1) AS 達成率 FROM 情報システム__incidents i GROUP BY i.priority
    ORDER BY i.priority
- q: インシデントを分類別に多い順で
