          同時使用: 同時に使える人数の上限
      seats:
        description: 保有数
      unit_cost:
        description: 年間単価（円）
      expires_on:
        description: 契約期限
  情報システム_工場側__license_assignments:
    description: |-
      ライセンスの割り当て。
      ※ 3か月以上使っていない割り当ては、棚卸（4月・10月）で回収する（ナレッジベース「ソフトウェアライセンス管理」）。
