  営業_顧客__deals:
    description: |-
      商談。1行 = 1案件。
      ※ フェーズは客観的な事実で判定する（提案書を出したらS3、見積を出したらS4）。「出す予定」ではフェーズを上げない。
    columns:
      deal_id:
        description: 商談ID
      customer_code:
        description: 顧客（customers）
      rep_code:
        description: 営業担当（sales_reps）
      line_code:
        description: 製品群（product_lines）
      opened_on:
        description: 起票日
      phase:
        description: 商談フェーズ
        values:
          S1: リード（名刺交換・問い合わせ）
          S2: ヒアリング（課題と予算感を聞けた）
          S3: 提案（提案書を提出した）
          S4: 見積（見積書を提出した）
          S5: 最終交渉（決裁者が特定できている）
          S6: 受注（注文書を受領）
          失注: 他社決定・見送りが確定
      probability:
        description: 確度（%）。フェーズに対応する標準値。担当者が勝手に上げ下げしない
      amount:
        description: 商談金額（円・税抜）
      expected_close:
        description: 受注予定日
      closed_on:
        description: 決着日。進行中はNULL
      result:
        description: 結果
        values:
          進行中: ''
          受注: ''
          失注: ''
      lost_reason:
        description: 失注理由。受注・進行中はNULL
        values:
          価格: 他社より高いと言われた
          納期: 求められた納期に応えられない
          仕様が合わない: 技術的に対応できない
          予算凍結・案件消滅: 客先都合
          品質・実績への不安: 実績を示せなかった
      competitor:
        description: 競合先。分からない場合はNULL
    glossary:
      受注予測額:
        description: 商談金額×確度の合計。S3以上のみを対象にする
        sql: SUM(amount * probability / 100.0)
      進行中の商談:
        description: まだ決着していない案件
        sql: result = '進行中'
      停滞案件:
        description: フェーズが2か月動いていない商談。上長レビューの対象になる
      有効な商談:
        description: 失注していない商談。予測や件数を数えるときはこちら
        sql: result <> '失注'
  営業_顧客__customers:
    description: 顧客マスタ。1行 = 1社。
    columns:
      customer_code:
        description: 顧客コード
      customer_name:
