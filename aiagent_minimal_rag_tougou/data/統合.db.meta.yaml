  部品_在庫__parts_master:
    description: 保全部品のマスタ。
    columns:
      part_code:
        description: 部品コード（SN-14 など）
      part_name:
        description: 品名
      cycle_months:
        description: 交換周期（月）。NULLは周期管理外
      cycle_hours:
        description: 交換周期（稼働時間）。NULLは時間管理なし
      unit_price:
        description: 単価（円）
      location:
        description: 保管場所（部品棚）
  部品_在庫__parts_usage:
    description: 部品の使用実績。1行 = 1回の払い出し。
    columns:
      usage_id:
        description: 使用ID
      part_code:
        description: 部品（parts_master）
      used_on:
        description: 使用日
      equip_code:
        description: 使った設備（equipment__equipment）
      qty:
        description: 数量
      work_id:
        description: 保全作業ID（equipment__maintenance_records）。計画交換はNULL
  部品_在庫__inventory:
    description: 現在の在庫。1行 = 1部品。
    columns:
      part_code:
        description: 部品
      qty_on_hand:
        description: 在庫数
      reorder_point:
        description: 発注点。在庫がこれを下回ったら発注する
      lead_days:
        description: 発注から納入までの日数
  部品_在庫__suppliers:
    description: 仕入先と部品の対応。1部品を複数の仕入先から買うことはない。
    columns:
      supplier_code:
        description: 仕入先コード
      supplier_name:
        description: 仕入先名
      part_code:
        description: 供給部品
      lead_days:
        description: 納期（日）。マスタ上の約束であり、実績は purchase_orders で見る
      unit_price:
        description: 仕入単価（円）
  部品_在庫__purchase_orders:
    description: |-
      発注の履歴。1行 = 1発注。
      ※ promised_on（納期回答）と arrived_on（実際の入荷日）を比べると遅延が分かる。マスタのリードタイムどおりに届くとは限らない。
      ※ 在庫が発注点を下回っているのに発注中の行が無い部品は、発注漏れ。
    columns:
      po_id:
        description: 発注ID
      part_code:
        description: 部品（parts_master）
      supplier_code:
        description: 仕入先（suppliers）
      ordered_on:
        description: 発注日
      qty:
        description: 数量
      promised_on:
        description: 納期回答日
      arrived_on:
        description: 実際の入荷日。発注中はNULL
      status:
        description: 状態
        values:
          入荷済: 納入完了
          発注中: 未入荷
    glossary:
      納期遅延:
        description: 実際の入荷が納期回答より遅れたもの
        sql: arrived_on IS NOT NULL AND arrived_on > promised_on
      入荷待ち:
        description: 発注したがまだ届いていないもの
        sql: status = '発注中'
