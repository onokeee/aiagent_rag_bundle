    平均復旧分 FROM 情報システム__incidents i GROUP BY i.category ORDER BY 件数 DESC
- q: 変更作業が原因の障害はどれくらいある？
  sql: SELECT strftime('%Y-%m', i.opened_at) AS 月, COUNT(*) AS 件数 FROM 情報システム__incidents
